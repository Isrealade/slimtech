name: Terraform Pipeline

on:
    push:
        paths: 
            - terraform/**
    workflow_dispatch: 
        inputs:
            apply: 
                description: 'Apply terraform plan file?'
                required: false
                default: false
                type: boolean

jobs:
    terraform:
        name: Initialize Terraform
        runs-on: ubuntu-latest
        environment: dev
        steps: 
            - name: Checkout Repo
              uses: actions/checkout@v6.0.2

            - name: Setup Terraform
              uses: hashicorp/setup-terraform@v4
              with:
                terraform_version: "1.14.6"

            - name: Terraform Format Check
              run: |
                terraform fmt -check

            - name: Initialize Terraform
              id: init
              run: |
                terraform init -input=false

            - name: Validate code
              run: |
                terraform validate
            
    plan:
        name: Terraform Plan
        runs-on: ubuntu-latest
        needs: terraform
        if: github.event_name == 'workflow_dispatch' && github.ref_name == 'main'
        steps: 
            - name: Checkout Repo
              uses: actions/checkout@v6.0.2

            - name: Setup Terraform
              uses: hashicorp/setup-terraform@v4
              with:
                terraform_version: "1.14.6"

            - name: Initialize Terraform
              id: init
              run: |
                terraform init -input=false

            - name: Terraform Plan
              run: terraform plan -no-color -input=false -out=./plan.md

            - name: Upload Plan Artifact
              id: upload
              uses: actions/upload-artifact@7.0.1
              with: 
                name: 'terraform-plan-file'
                path: ./plan.out
                if-no-files-found: 'error'
                retention-days: 1
                archive: false

    apply:
        name: Terraform Plan
        runs-on: ubuntu-latest
        needs: plan
        if: inputs.apply == 'true'
        steps:
            - name: Checkout Repo
              uses: actions/checkout@v6.0.2

            - name: Setup Terraform
              uses: hashicorp/setup-terraform@v4
              with:
                terraform_version: "1.14.6"

            - name: Initialize Terraform
              id: init
              run: |
                terraform init -input=false

            - name: Download Plan artifact
              uses: actions/download-artifact@v8.0.1
              with:
                name: 'terraform-plan-file'
                path: ./plan.out

            - name: Apply Plan file
              run: |
                terraform apply plan.out